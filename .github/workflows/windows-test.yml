# Windows 實機驗證：在 macOS 上以正式發版的方式打包，再到 Windows 上執行單元測試與實測
name: Windows test

on:
  push:
    branches: ["test/**"]
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/

  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: 單元測試
        run: bun test
      - name: 型別檢查
        run: bun run typecheck

  smoke:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release/
      - name: 實測 am.exe 與安裝腳本
        shell: pwsh
        run: ./scripts/ci/windows-smoke.ps1
